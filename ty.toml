[environment]
extra-paths = ["./gguf-py", "./examples/model-conversion/scripts", "./tools/server/tests", "./scripts/snapdragon/qdc/tests"]
python-version = "3.10"

[rules]
deprecated = "warn"

[src]
exclude = [
    "./tools/mtmd/legacy-models/**",
]

[[overrides]]
include = [
    "./tools/server/tests/**",
    "./scripts/snapdragon/qdc/**",
    "./tools/mtmd/tests/**",
]

[overrides.rules]
unresolved-reference = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[[overrides]]
include = [
    "./examples/pydantic_models_to_grammar.py",
]

[overrides.rules]
unsupported-operator = "ignore"
not-subscriptable = "ignore"

[[overrides]]
include = [
    "./scripts/p100/configure_unsloth.py",
    "./scripts/p100/restore_unsloth.py",
    "./scripts/p100/thermal_unsloth.py",
    "./scripts/p100/context_unsloth.py",
    "./scripts/p100/configure_unsloth_thermal.py",
    "./scripts/p100/shared_memory.py",
]

[overrides.rules]
# Unsloth provides these modules in its desktop Python environment.
unresolved-import = "ignore"
